name: cli-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          path: contribready-cli
      - name: Check out the Core release candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/contribready-core
          path: contribready-core
          # Integration candidate for this review; switch to main after Core is merged.
          ref: audit/readiness-review-20261018-core
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: contribready-cli/package-lock.json
      - name: Install Core development dependencies
        run: npm ci --prefix contribready-core --ignore-scripts --no-audit --no-fund
      - name: Verify Core
        run: npm run verify --prefix contribready-core
      - name: Pack Core for a local release simulation
        working-directory: contribready-core
        run: npm pack --pack-destination ..
      - name: Install CLI and its packed Core dependency from local artifacts
        working-directory: contribready-cli
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund ../contribready-core-0.1.0.tgz
      - name: Verify CLI against the packed Core artifact
        working-directory: contribready-cli
        run: npm run verify
