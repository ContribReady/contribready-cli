name: cli-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          path: contribready-cli
      - name: Check out the compatible Core repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/contribready-core
          path: contribready-core
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: contribready-cli/package-lock.json
      - run: npm ci --prefix contribready-cli
      - run: npm ci --prefix contribready-core
      - run: npm run build --prefix contribready-core
      - run: npm run verify --prefix contribready-cli
